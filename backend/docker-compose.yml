version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aurabeat
      POSTGRES_PASSWORD: aurabeat
      POSTGRES_DB: aurabeat
    ports:
      - "5434:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
